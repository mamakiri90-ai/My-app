<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No smoke | No sugar</title>
<style>
:root{--bg:#fff6fb;--card:#fff;--tx:#241338;--mu:#6e6285;--bd:#efdcf7;--v:#7c3aed;--p:#ec4899;--o:#f97316;--g:#10b981;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150b2b;--card:#221441;--tx:#f7f0ff;--mu:#b3a5d1;--bd:#3a2766;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150b2b;--card:#221441;--tx:#f7f0ff;--mu:#b3a5d1;--bd:#3a2766;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:16px 14px 40px}
.logo{font-weight:900;font-size:26px;letter-spacing:-.5px;background:linear-gradient(90deg,var(--v),var(--p),var(--o));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo b{color:var(--mu);-webkit-text-fill-color:var(--mu);font-weight:300;margin:0 4px}
.hi{color:var(--mu);margin:2px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:12px}
.mu{color:var(--mu);font-size:14px}
.hero{border-radius:28px;padding:22px 18px;color:#fff;text-align:center;margin-bottom:12px;background:linear-gradient(120deg,#7c3aed,#ec4899,#f97316,#7c3aed);background-size:300% 300%;animation:flow 9s ease infinite;box-shadow:0 14px 34px rgba(236,72,153,.35)}
@keyframes flow{50%{background-position:100% 50%}}
.hero .lbl{font-weight:700;opacity:.92}
.big{font-size:84px;font-weight:900;line-height:1;margin:6px 0}
.big small{font-size:24px;font-weight:700;margin-left:8px}
.clock{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:2px}
.lbl{font-weight:700}
#nx{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;margin:4px 0 8px;color:var(--v)}
.bar{height:12px;border-radius:9px;background:var(--bd);overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--v),var(--p),var(--o));transition:width 1s linear}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{border-radius:20px;padding:14px;color:#fff;min-height:104px}
.tile:nth-child(4n+1){background:linear-gradient(135deg,#10b981,#06b6d4)}
.tile:nth-child(4n+2){background:linear-gradient(135deg,#f97316,#ef4444)}
.tile:nth-child(4n+3){background:linear-gradient(135deg,#8b5cf6,#d946ef)}
.tile:nth-child(4n){background:linear-gradient(135deg,#f59e0b,#ec4899)}
.tile .v{font-size:26px;font-weight:900;line-height:1.1;margin-top:4px;word-break:break-word}
.tile .s{font-size:12px;opacity:.9}
.panic{width:100%;border:0;border-radius:22px;padding:18px;font:800 17px inherit;font-family:inherit;color:#fff;background:linear-gradient(90deg,#ef4444,#f97316);margin-bottom:12px;animation:pulse 2.4s ease-in-out infinite;cursor:pointer}
@keyframes pulse{50%{transform:scale(1.02);box-shadow:0 8px 26px rgba(239,68,68,.45)}}
h2{font-size:20px;margin:18px 2px 10px}
.ms{display:flex;gap:12px;border-radius:20px;padding:14px;margin-bottom:10px;background:var(--card);border:1px solid var(--bd)}
.ms.on{border:2px solid var(--p);background:linear-gradient(135deg,rgba(124,58,237,.12),rgba(249,115,22,.12));cursor:pointer}
.ms.off{opacity:.62}
.ms .em{font-size:32px}
.ms h4{margin:0 0 4px;font-size:17px}
.ms p{margin:3px 0;font-size:14px}
.rem{font-size:13px;color:var(--v);font-weight:700}
.foot{display:flex;gap:8px;margin-top:18px}
.btn,.ghost{border:0;border-radius:16px;padding:14px 18px;font:700 16px inherit;font-family:inherit;cursor:pointer}
.btn{background:linear-gradient(90deg,var(--v),var(--p));color:#fff;width:100%}
.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd);flex:1}
.disc{font-size:12px;color:var(--mu);margin-top:14px;text-align:center}
.f{display:block;margin:12px 0 4px;font-weight:700;font-size:14px}
input,select,textarea{width:100%;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:12px;font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--p);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:30%;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:12px 6px;font:700 15px inherit;font-family:inherit;cursor:pointer}
.chip.sel{border-color:var(--p);background:linear-gradient(135deg,var(--v),var(--p));color:#fff}
.hid{display:none}
.err{color:#ef4444;font-weight:700;margin-top:10px}
.ov{position:fixed;inset:0;background:rgba(20,8,40,.72);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;overflow:auto}
.box{background:var(--card);color:var(--tx);border-radius:28px;padding:24px 20px;max-width:440px;width:100%;text-align:center;border:3px solid var(--p);animation:pop .35s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.box .em{font-size:64px}
.box h3{font-size:24px;margin:6px 0;background:linear-gradient(90deg,var(--v),var(--p),var(--o));-webkit-background-clip:text;background-clip:text;color:transparent}
.box p{margin:8px 0;text-align:left}
.breath{width:150px;height:150px;border-radius:50%;margin:14px auto;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--v),var(--p));animation:br 8s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.7)}50%{transform:scale(1.1)}}
.pt{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.cf{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.hero,.panic,.breath{animation:none}.cf{display:none}}

#app{padding-bottom:110px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.mt{border:1px solid var(--bd);background:var(--card);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}
button{transition:transform .15s}
button:active,.ms.on:active,.rc:active{transform:scale(.94)}
.tabs{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:flex;background:var(--card);border-top:1px solid var(--bd);border-radius:24px 24px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 -8px 26px rgba(124,58,237,.2)}
.tabs button{flex:1;border:0;background:none;color:var(--mu);font:700 11px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;cursor:pointer}
.tabs i{font-style:normal;font-size:22px;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.tabs button.on{color:var(--p)}.tabs button.on i{transform:translateY(-5px) scale(1.3)}
.scr{display:none}.scr.on{display:block;animation:inr .4s cubic-bezier(.2,.9,.3,1)}.scr.on.l{animation-name:inl}
@keyframes inr{from{opacity:0;transform:translateX(46px)}}
@keyframes inl{from{opacity:0;transform:translateX(-46px)}}
.stage{border-radius:26px;overflow:hidden;height:190px;box-shadow:0 10px 28px rgba(124,58,237,.3)}
.stage svg{width:100%;height:100%;display:block}
.sm{opacity:calc(var(--sm,1)*.85)}.sm ellipse{animation:dr 8s ease-in-out infinite alternate}
@keyframes dr{to{transform:translateX(34px)}}
.wr{opacity:var(--wr,1)}
.sun{opacity:calc(.3 + var(--fl,.15)*.7);transform-box:fill-box;transform-origin:center;animation:gl 3s ease-in-out infinite alternate}
@keyframes gl{to{transform:scale(1.12)}}
.fw{transform-box:fill-box;transform-origin:50% 100%;animation:sw 3s ease-in-out infinite alternate}
@keyframes sw{from{transform:scale(var(--fl,.15)) rotate(-5deg)}to{transform:scale(var(--fl,.15)) rotate(5deg)}}
.cr{position:relative;width:72%;margin:-46px auto 0;aspect-ratio:1312/1199;border-radius:30px;overflow:hidden;border:4px solid #fff;box-shadow:0 14px 34px rgba(236,72,153,.45);animation:bob 3.6s ease-in-out infinite;cursor:pointer}
.cr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@keyframes bob{50%{transform:translateY(-6px) rotate(.8deg)}}
.cr.jump{animation:jmp .6s}
@keyframes jmp{30%{transform:translateY(-28px) scale(1.07) rotate(-3deg)}60%{transform:translateY(0) scale(.97)}}
.bub{background:var(--card);border:2px solid var(--p);border-radius:20px;padding:12px 14px;margin:14px 6px 8px;text-align:center;font-weight:700}
.c{text-align:center}
.btn:disabled{opacity:.65;filter:grayscale(.4);cursor:default}
.rc{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;border:1px solid var(--bd);margin-bottom:8px;background:var(--card);cursor:pointer;transition:transform .15s}
.rc.off{opacity:.55;cursor:default}.rc.ck{border-color:var(--g)}.rc i{font-style:normal;font-size:24px}
.ring{width:124px;height:124px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:6px auto}
.ring b{width:96px;height:96px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:30px}
.cmp p{margin:9px 0}
.ht{position:fixed;bottom:34%;font-size:30px;z-index:99;pointer-events:none;animation:rise 1.9s ease-out forwards}
@keyframes rise{to{transform:translateY(-170px);opacity:0}}
@media (prefers-reduced-motion:reduce){.cr,.scr.on,.sm ellipse,.fw,.sun,.ht{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var app=document.getElementById('app'),mem={};
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
var P=null,seen=[],lastU=-1,timer=null,pi=null;
try{P=JSON.parse(store.get('nsns')||'null')}catch(e){}
try{seen=JSON.parse(store.get('nsns_seen')||'[]')}catch(e){}
function save(){store.set('nsns',JSON.stringify(P));store.set('nsns_seen',JSON.stringify(seen))}
var E=function(i){return document.getElementById(i)};
var pad=function(n){return String(n).padStart(2,'0')};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var nf=function(n){return Math.floor(n).toLocaleString('ru-RU')};
var fm=function(n){return n<100?n.toFixed(2).replace('.',','):nf(n)};
function pl(n,a){n=Math.floor(Math.abs(n));var m=n%100,k=n%10;return m>10&&m<20?a[2]:k==1?a[0]:k>1&&k<5?a[1]:a[2]}
function dur(s){s=Math.max(0,Math.floor(s));var d=Math.floor(s/86400);return (d?d+' д ':'')+pad(Math.floor(s%86400/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)}
function lifeFmt(m){m=Math.floor(m);if(m<60)return m+' мин';if(m<1440)return Math.floor(m/60)+' ч '+(m%60)+' мин';return Math.floor(m/1440)+' д '+Math.floor(m%1440/60)+' ч'}
var M=[
{d:1/72,e:'⏱️',t:'20 минут',sm:'Пульс и давление приходят в норму, руки и ноги теплеют.'},
{d:1/3,e:'🫁',t:'8 часов',sm:'Угарный газ в крови падает, кислорода становится больше — тканям легче дышать.'},
{d:1,e:'🌅',t:'1 день',sm:'Кислород в крови почти в норме, сердцу легче работать, риск инфаркта начинает снижаться.',su:'Скачки глюкозы выравниваются. Тяга приходит волнами — мозг учится жить без быстрого дофамина.'},
{d:3,e:'🔥',t:'3 дня',sm:'Никотин почти выведен, обостряются вкус и запахи. Пик абстиненции — дальше легче.',su:'Пик «сахарной ломки»: возможны раздражительность и головная боль. Скоро станет заметно легче.'},
{d:5,e:'✨',t:'5 дней',sm:'Бронхи расслабляются, дышать свободнее, реснички лёгких начинают очищаться.',su:'Энергия ровнее: меньше провалов после еды, спокойнее сон и настроение.'},
{d:10,e:'💎',t:'10 дней',sm:'Кровоток улучшается, кожа свежее, утренний кашель слабеет.',su:'Рецепторы перенастраиваются: обычная еда и фрукты кажутся вкуснее и слаще.'},
{d:14,e:'🚀',t:'2 недели',sm:'Кровообращение заметно лучше, подниматься по лестнице легче, растёт выносливость.',su:'Тяга заметно слабее, уходит отёчность, кожа становится чище.'},
{d:30,e:'👑',t:'1 месяц',sm:'Функция лёгких растёт, кашель и одышка уменьшаются, прибавляется энергии.',su:'Воспаление снижается, чувствительность к инсулину улучшается, привычка закрепляется.'},
{d:90,e:'🌈',t:'3 месяца',sm:'Лёгкие заметно очищены, кровообращение и выносливость на новом уровне.',su:'Вкус изменился надолго, тяга — редкая гостья, самочувствие стабильнее.'},
{d:180,e:'🏅',t:'6 месяцев',sm:'Реже простуды, дыхание глубже, стресс переносится спокойнее.',su:'Полгода ровной энергии, чище кожа, лучше концентрация.'},
{d:365,e:'🏆',t:'1 год',sm:'Риск ишемической болезни сердца вдвое ниже, чем у курящего человека.',su:'Год без сахара — это уже образ жизни. Контроль над вкусом снова у тебя.'}];
var CG=['Это настоящая победа!','Ты сильнее любой привычки!','Так держать — организм говорит «спасибо»!','Каждый день без — это подарок себе!','Гордимся тобой, ты звезда!'];
var TIPS=['Выпей стакан холодной воды маленькими глотками.','Выйди на 5 минут на воздух или пройдись по лестнице.','Тяга длится 3–5 минут и уходит сама — просто переждём.','Пожуй морковку, орешки или жвачку без сахара.','Позвони другу или напиши в чат — отвлечься полезно.','Умойся прохладной водой и сделай 10 приседаний.','Вспомни, зачем ты начал(а): твоя причина сильнее минутной тяги.','Положи руки на живот и дыши медленно: вдох на 4, выдох на 4.'];
function el(){return Math.max(0,(Date.now()-P.start)/1000)}
function list(){return M.filter(function(m){return P.goal=='both'||(P.goal=='smoke'?m.sm:m.su)})}
function S(e){var d=e/86400,sm=P.goal!='sugar',su=P.goal!='smoke',o={},nc=0,ns=0;
(P.sl||[]).forEach(function(x){x.k=='c'?nc++:ns++});
o.cig=sm?Math.max(0,Math.floor(d*P.cpd)-nc):0;o.sw=su?Math.max(0,Math.floor(d*P.spd)-ns):0;
o.money=Math.max(0,(sm?(d*P.cpd-nc)/P.pack*P.price:0)+(su?(d*P.spd-ns)*P.sprice:0));o.life=o.cig*6;o.sugar=o.sw*20;return o}
function what(){return P.goal=='smoke'?'сигарет':P.goal=='sugar'?'сладкого':'сигарет и сладкого'}
function tzv(ts){return new Date(ts-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}

/* ---------- Анкета ---------- */
function onboard(){
 var o=P||{goal:'both',pack:20,cur:'₴',start:Date.now(),wins:0},G=o.goal;
 app.innerHTML='<div class="logo">No smoke <b>|</b> No sugar</div><div class="hi">Расскажи о себе — посчитаем твою победу 💜</div><div class="card">'+
 '<label class="f">Как тебя зовут?</label><input id="nm" value="'+esc(o.name||'')+'" placeholder="Имя">'+
 '<label class="f">Возраст</label><input id="ag" type="number" inputmode="numeric" value="'+(o.age||'')+'" placeholder="Например, 32">'+
 '<label class="f">От чего отказываешься?</label><div class="chips"><button class="chip" data-g="smoke">🚬 Сигареты</button><button class="chip" data-g="sugar">🍬 Сладкое</button><button class="chip" data-g="both">🔥 Всё сразу</button></div>'+
 '<div id="bs"><label class="f">Сигарет в день</label><input id="cpd" type="number" inputmode="decimal" value="'+(o.cpd||'')+'" placeholder="Например, 15">'+
 '<div class="row"><div><label class="f">Сигарет в пачке</label><input id="pk" type="number" inputmode="numeric" value="'+(o.pack||20)+'"></div><div><label class="f">Цена пачки</label><input id="pr" type="number" inputmode="decimal" value="'+(o.price||'')+'" placeholder="100"></div></div>'+
 '<label class="f">Сколько лет куришь</label><input id="yr" type="number" inputmode="decimal" value="'+(o.years||'')+'" placeholder="Например, 8"></div>'+
 '<div id="bg"><label class="f">Сладкого в день (конфеты, печенье, десерты, сладкие напитки — порций)</label><input id="spd" type="number" inputmode="decimal" value="'+(o.spd||'')+'" placeholder="Например, 4">'+
 '<label class="f">Средняя цена одной порции</label><input id="spr" type="number" inputmode="decimal" value="'+(o.sprice||'')+'" placeholder="Например, 30"></div>'+
 '<label class="f">Твоя главная причина бросить</label><textarea id="why" rows="2" placeholder="Здоровье, семья, красота, деньги…">'+esc(o.why||'')+'</textarea>'+
 '<div class="row"><div><label class="f">Валюта</label><select id="cur"><option>₴</option><option>₽</option><option>$</option><option>€</option><option>zł</option></select></div>'+
 '<div><label class="f">Начало отсчёта</label><input id="st" type="datetime-local" value="'+tzv(o.start)+'" max="'+tzv(Date.now())+'"></div></div>'+
 '<div class="err" id="er"></div><div style="height:14px"></div><button class="btn" id="go">'+(P?'Сохранить':'Начать новую жизнь 🚀')+'</button></div>';
 E('cur').value=o.cur;
 function sh(){document.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('sel',c.dataset.g==G)});E('bs').classList.toggle('hid',G=='sugar');E('bg').classList.toggle('hid',G=='smoke')}
 document.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){G=c.dataset.g;sh()}});sh();
 E('go').onclick=function(){
  var n=E('nm').value.trim(),v=function(i){return parseFloat(E(i).value)},er=[];
  if(!n)er.push('имя');if(!(v('ag')>0))er.push('возраст');
  if(G!='sugar'&&!(v('cpd')>0&&v('pk')>0&&v('pr')>=0&&E('pr').value!==''))er.push('данные о сигаретах');
  if(G!='smoke'&&!(v('spd')>0&&E('spr').value!==''))er.push('данные о сладком');
  if(er.length){E('er').textContent='Заполни: '+er.join(', ');return}
  var st=E('st').value?new Date(E('st').value).getTime():Date.now();if(st>Date.now())st=Date.now();
  if(!P||P.start!=st)seen=[];
  P={name:n,age:v('ag'),goal:G,cpd:v('cpd')||0,pack:v('pk')||20,price:v('pr')||0,years:v('yr')||0,spd:v('spd')||0,sprice:v('spr')||0,why:E('why').value.trim(),cur:E('cur').value,start:st,wins:(P&&P.wins)||0,ck:(P&&P.ck)||[],sl:(P&&P.sl)||[],rc:(P&&P.rc)||[]};
  save();dash()}
}

  h+='<div class="ms '+(on?'on':'off')+'" data-i="'+m.t+'"><div class="em">'+(on?m.e:'🔒')+'</div><div><h4>'+m.t+(on?' — открыто! 🎉':'')+'</h4>'+tx+(on?'<div class="rem">Нажми, чтобы увидеть поздравление</div>':'<div class="rem" data-d="'+m.d+'"></div>')+'</div></div>'});
 E('tl').innerHTML=h;
 document.querySelectorAll('.ms.on').forEach(function(x){x.onclick=function(){congrats(M.filter(function(m){return m.t==x.dataset.i})[0],false)}})
}
function rc(){
 var d=el()/86400,r=RC.filter(function(x){return x.g=='a'||(x.g=='s'?P.goal!='sugar':P.goal!='smoke')}),n=0,h='';
 r.forEach(function(x){var on=d>=x.d,ch=P.rc.indexOf(x.d)>=0;if(ch)n++;h+='<div class="rc'+(on?'':' off')+(ch?' ck':'')+'" data-d="'+x.d+'"><i>'+(on?(ch?'✅':'⬜'):'🔒')+'</i><div><b>День '+x.d+'</b><br>'+x.t+'</div></div>'});
 var pc=Math.round(n/r.length*100);E('rcl').innerHTML=h;E('rcb').style.width=pc+'%';E('rcp').textContent=pc+'%';
 document.querySelectorAll('.rc:not(.off)').forEach(function(x){x.onclick=function(){var v=+x.dataset.d,i=P.rc.indexOf(v);i<0?P.rc.push(v):P.rc.splice(i,1);save();if(i<0){snd('pop');hearts()}rc()}})
}
function notes(){
 var n=P.sl.filter(function(x){return x.n}).slice(-3).reverse();
 E('nts').innerHTML=n.length?n.map(function(x){return '<div class="ms"><div class="em">📝</div><div><div class="mu">'+new Date(x.t).toLocaleDateString('ru-RU')+'</div><p>'+esc(x.n)+'</p></div></div>'}).join(''):'<div class="mu">Здесь появятся твои подсказки себе — их покажет кнопка «Хочу закурить / съесть сладкое».</div>'
}
function jump(){var c=E('cr');c.classList.remove('jump');void c.offsetWidth;c.classList.add('jump');setTimeout(function(){c.classList.remove('jump')},650)}
function hearts(){for(var i=0;i<8;i++){var h=document.createElement('span');h.className='ht';h.textContent=['💗','💖','✨','🌸'][i%4];h.style.cssText='left:'+(15+Math.random()*70)+'vw;animation-delay:'+i*.08+'s';document.body.appendChild(h);(function(q){setTimeout(function(){q.remove()},2300)})(h)}}
function home(){
 var n=P.ck.length,k=Math.min(1,n/21),done=P.ck.indexOf(td())>=0,b=E('ck');
 E('i2').style.opacity=k;E('i1').style.opacity=1-k;E('kb').style.width=k*100+'%';
 E('kt').textContent='Доброта: '+Math.min(n,21)+' из 21 дня 💗';
 if(n!=lastN){lastN=n;E('bb').textContent=MSG[Math.min(4,Math.floor(k*4.99))]}
 b.disabled=done;b.textContent=done?'Сегодня отмечено ✅ Приходи завтра':'☀️ Доброе утро! Отметиться';
 E('dl').textContent='День '+(Math.floor(el()/86400)+1)+' без '+what()
}
function checkin(){
 var t=td();if(P.ck.indexOf(t)>=0)return;P.ck.push(t);save();snd('ok');conf();hearts();jump();home();
 if(P.ck.length==21)setTimeout(function(){openM('<div class="em">🥰</div><h3>Он стал милым!</h3><p style="text-align:center">Комок ярости превратился в «ми-ми-ми» благодаря твоим 21 утрам. Он тобой гордится!</p><button class="btn" id="ok">Ура! 💗</button>');E('ok').onclick=closeM;conf();snd('ok')},900)
}
function pur(){var tot=Math.max(7,Math.ceil(el()/86400)),u={};P.sl.forEach(function(x){u[new Date(x.t).toDateString()]=1});return Math.max(0,Math.round(100*(1-Object.keys(u).length/tot)))}
function upd(){
 var e=el(),s=S(e),d=e/86400,D=Math.floor(d),c=P.cur,L=list(),p=Math.min(1,d/30),g=P.goal;
 E('tD').textContent=D;E('tDl').textContent=pl(D,['день','дня','дней']);
 E('tT').textContent=pad(Math.floor(e%86400/3600))+':'+pad(Math.floor(e%3600/60))+':'+pad(Math.floor(e%60));
 var n=L.filter(function(m){return m.d*86400>e})[0],pr=L.filter(function(m){return m.d*86400<=e}).pop();
 if(n){var a=pr?pr.d*86400:0,b=n.d*86400;E('nt').textContent='«'+n.t+'» '+n.e;E('nx').innerHTML='<div style="font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--v)">'+dur(b-e)+'</div>';E('pb').style.width=Math.min(100,(e-a)/(b-a)*100)+'%';E('nm').textContent='Уже '+Math.floor((e-a)/(b-a)*100)+'% пути до следующего достижения'}
 else{E('nt').textContent='';E('nx').textContent='Все рубежи пройдены 👑';E('pb').style.width='100%';E('nm').textContent='Ты легенда. Продолжай жить свободно!'}
 E('s1').textContent=fm(s.money)+' '+c;
 var yr=(g!='sugar'?P.cpd/P.pack*P.price*365:0)+(g!='smoke'?P.spd*P.sprice*365:0);E('s1b').textContent='за год ≈ '+nf(yr)+' '+c;
 if(E('s2'))E('s2').textContent=nf(s.cig);
 if(E('s3')){E('s3').textContent=nf(s.sw);E('s3b').textContent='порций · ≈ '+(s.sugar>=1000?(s.sugar/1000).toFixed(1).replace('.',',')+' кг':nf(s.sugar)+' г')+' сахара'}
 if(E('s4'))E('s4').textContent=lifeFmt(s.life);
 E('s5').textContent=P.wins||0;
 var h='';
 if(g!='smoke'){var kg=s.sugar/1000,r=pick(CS,kg);h+='<p>🍬 Не съедено <b>'+kg.toFixed(1).replace('.',',')+' кг</b> сахара'+(r?' — это вес '+r[1]:' — копим на первый килограмм')+'.</p>'}
 if(g!='sugar'){var m=s.cig*.084,r2=pick(CL,m),f=Math.floor(s.life/120);h+='<p>🚬 Невыкуренные сигареты в ряд — <b>'+m.toFixed(1).replace('.',',')+' м</b>'+(r2?', уже как '+r2[1]:'')+'.</p><p>⏳ Освободилось <b>'+(s.life/60).toFixed(1).replace('.',',')+' ч</b> жизни'+(f?' — хватит на '+f+' '+pl(f,['фильм','фильма','фильмов']):' — скоро хватит на первый фильм')+'.</p>'}
 E('cmp').innerHTML=h;
 var v=pur();E('pr').style.background='conic-gradient(#10b981 '+v*3.6+'deg,var(--bd) 0)';E('pv').textContent=v+'%';E('pm').textContent=v>=100?'Идеально чисто! 🌟':'Срыв не обнуляет путь: все твои дни остаются с тобой.';
 var sc=E('sc').style;sc.setProperty('--sm',g!='sugar'?1-p:0);sc.setProperty('--wr',g!='smoke'?1-p:0);sc.setProperty('--fl',.15+.85*p);
 home();
 if(D!=lastD){lastD=D;rc()}
 document.querySelectorAll('.rem[data-d]').forEach(function(r){r.textContent='Откроется через '+dur(r.dataset.d*86400-e)});
 var u=L.filter(function(m){return m.d*86400<=e}).length;
 if(u!=lastU){lastU=u;tl();celebrate()}
}

/* ---------- Поздравления ---------- */
function openM(h){closeM();var o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML='<div class="box">'+h+'</div>';document.body.appendChild(o);return o}
function closeM(){clearInterval(pi);var o=E('ov');if(o)o.remove()}
function conf(){var c=['#ec4899','#f97316','#7c3aed','#10b981','#facc15','#38bdf8'];for(var i=0;i<70;i++){var p=document.createElement('i');p.className='cf';p.style.cssText='left:'+Math.random()*100+'vw;background:'+c[i%6]+';animation-delay:'+Math.random()*.6+'s;animation-duration:'+(2+Math.random()*2)+'s';document.body.appendChild(p);(function(q){setTimeout(function(){q.remove()},5000)})(p)}}
function celebrate(){
 var e=el(),un=list().filter(function(m){return m.d*86400<=e&&seen.indexOf(m.t)<0});
 if(!un.length)return;un.forEach(function(m){seen.push(m.t)});save();congrats(un[un.length-1],true)
}
function congrats(m,fresh){
 var s=S(m.d*86400),i=M.indexOf(m),tx='';
 if(m.sm&&P.goal!='sugar')tx+='<p>'+(P.goal=='both'?'🚬 ':'')+m.sm+'</p>';
 if(m.su&&P.goal!='smoke')tx+='<p>'+(P.goal=='both'?'🍬 ':'')+m.su+'</p>';
 var st='💰 Сэкономлено: <b>'+fm(s.money)+' '+P.cur+'</b>'+(P.goal!='sugar'?'<br>🚬 Не выкурено: <b>'+nf(s.cig)+'</b>':'')+(P.goal!='smoke'?'<br>🍬 Не съедено: <b>'+nf(s.sw)+'</b>':'');
 openM('<div class="em">'+m.e+'</div><h3>Поздравляем, '+esc(P.name)+'!</h3><div class="lbl">'+m.t+' без '+what()+'</div><p><b>Что происходит в организме:</b></p>'+tx+'<p class="mu">'+st+'</p><p style="text-align:center;font-weight:800">'+CG[i%CG.length]+'</p><button class="btn" id="ok">Продолжаем 💪</button>');
 E('ok').onclick=closeM;conf()
}
function panic(){
 var t=300,tp=TIPS.slice().sort(function(){return Math.random()-.5}),ln=P.sl.filter(function(x){return x.n}).pop();
 if(ln)tp.unshift('Твоя подсказка себе: «'+esc(ln.n)+'»');snd('soft');
 openM('<div class="em">🫶</div><h3>Тяга длится 3–5 минут</h3><div class="mu">Переждём вместе. Дыши по кругу.</div><div class="breath"><span id="bt">Вдох…</span></div><div class="pt" id="pc">05:00</div><p id="tp">'+tp[0]+'</p><button class="btn" id="ok">Тяга прошла ✅</button><div style="height:8px"></div><button class="ghost" style="width:100%" id="cl">Закрыть</button>');
 pi=setInterval(function(){t--;E('pc').textContent=pad(Math.floor(Math.max(t,0)/60))+':'+pad(Math.max(t,0)%60);E('bt').textContent=(300-t)%8<4?'Вдох…':'Выдох…';if(t%30==0)E('tp').innerHTML=tp[(300-t)/30%tp.length];if(t<=0)clearInterval(pi)},1000);
 E('cl').onclick=closeM;E('ok').onclick=function(){P.wins=(P.wins||0)+1;save();closeM();upd();conf();snd('ok')}
}
function slip(){
 var g=P.goal,kk=g=='sugar'?'s':'c';
 openM('<div class="em">🤗</div><h3>Срыв — это не конец</h3><p class="mu c">Твой путь не обнуляется. Честно запишем и пойдём дальше.</p><div class="chips" id="sk2">'+(g!='sugar'?'<button class="chip'+(g=='smoke'||g=='both'?' sel':'')+'" data-k="c">🚬 Сигарета</button>':'')+(g!='smoke'?'<button class="chip'+(g=='sugar'?' sel':'')+'" data-k="s">🍬 Сладкое</button>':'')+'</div><p><b>Что помогло бы его избежать?</b></p><textarea id="sn" rows="3" placeholder="Например: прогулка, стакан воды, звонок другу"></textarea><div style="height:10px"></div><button class="btn" id="sv">Сохранить заметку 💜</button><div style="height:8px"></div><button class="ghost" style="width:100%" id="cl">Закрыть</button>');
 document.querySelectorAll('#sk2 .chip').forEach(function(c){c.onclick=function(){kk=c.dataset.k;document.querySelectorAll('#sk2 .chip').forEach(function(x){x.classList.toggle('sel',x==c)})}});
 E('cl').onclick=closeM;
 E('sv').onclick=function(){P.sl.push({t:Date.now(),k:kk,n:E('sn').value.trim()});save();notes();upd();snd('soft');
  openM('<div class="em">💜</div><h3>Спасибо за честность</h3><p class="c">Индекс чистоты теперь <b>'+pur()+'%</b>, а все твои дни остаются с тобой. Заметка сохранена — она поддержит в трудную минуту.</p><button class="btn" id="ok">Иду дальше 💪</button>');E('ok').onclick=closeM}
}
if(P){P.ck=P.ck||[];P.sl=P.sl||[];P.rc=P.rc||[]}
if(P&&P.start)dash();else onboard();
</script>
</body>
